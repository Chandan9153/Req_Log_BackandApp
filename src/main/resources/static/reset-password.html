<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | User Authentication System</title>
  <meta name="description" content="Set a new password for your account using a secure, time-limited token.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="ambient-background">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </div>
        <h1 class="auth-title">Create New <span class="gradient-text">Password</span></h1>
        <p class="auth-subtitle">Please choose a strong password with at least 8 characters.</p>
      </div>

      <div id="reset-alert" class="alert-box"></div>

      <form id="reset-form" novalidate>
        <!-- Token Field -->
        <div class="form-group" id="group-token">
          <label for="token" class="form-label">
            <span>Reset Token</span>
            <span id="token-status-badge" class="badge-pill" style="display: none;"></span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
              </svg>
            </span>
            <input type="text" id="token" name="token" class="form-control" placeholder="Paste your reset token here" required>
          </div>
          <div class="form-error-text"></div>
        </div>

        <!-- New Password -->
        <div class="form-group" id="group-newPassword">
          <label for="newPassword" class="form-label">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="newPassword" aria-label="Show password">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Password Strength Meter -->
          <div class="password-strength-container" id="strength-container" style="display: none;">
            <div class="password-strength-bars">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
            <div class="strength-info">
              <span>Security strength:</span>
              <span class="strength-label" id="strength-text">Weak</span>
            </div>
          </div>
          <div class="form-error-text"></div>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group" id="group-confirmPassword">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="confirmPassword" aria-label="Show password">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="form-error-text"></div>
        </div>

        <button type="submit" id="reset-btn" class="btn btn-primary" style="margin-top: 1.5rem;">
          <span class="spinner"></span>
          <span class="btn-text">Save New Password</span>
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="/login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
