<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Modern User Registration</title>
  <meta name="description" content="Sign up for a secure, modern account. Built with Spring Boot, Spring Security, and MySQL.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-background">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card wide-card">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo-badge">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1 class="auth-title">Create your <span class="gradient-text">Account</span></h1>
        <p class="auth-subtitle">Join us in seconds. Fast, secure, and easy setup.</p>
      </div>

      <!-- Inline Alert Box -->
      <div id="register-alert" class="alert-box"></div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        <!-- Row: Full Name & Username -->
        <div class="form-row">
          <div class="form-group" id="group-fullName">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </span>
              <input type="text" id="fullName" name="fullName" class="form-control" placeholder="John Doe" required autocomplete="name">
            </div>
            <div class="form-error-text"></div>
          </div>

          <div class="form-group" id="group-username">
            <label for="username" class="form-label">Username</label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                </svg>
              </span>
              <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" required autocomplete="username">
            </div>
            <div class="form-error-text"></div>
          </div>
        </div>

        <!-- Row: Email & Mobile Number (Optional) -->
        <div class="form-row">
          <div class="form-group" id="group-email">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </span>
              <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
            </div>
            <div class="form-error-text"></div>
          </div>

          <div class="form-group" id="group-mobileNumber">
            <label for="mobileNumber" class="form-label">
              <span>Mobile Number</span>
              <span class="form-label-optional">(optional)</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
              </span>
              <input type="tel" id="mobileNumber" name="mobileNumber" class="form-control" placeholder="+1 (555) 000-0000" autocomplete="tel">
            </div>
            <div class="form-error-text"></div>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group" id="group-password">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Password Strength Meter -->
          <div class="password-strength-container" id="strength-container" style="display: none;">
            <div class="password-strength-bars">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
            <div class="strength-info">
              <span>Security strength:</span>
              <span class="strength-label" id="strength-text">Weak</span>
            </div>
          </div>
          <div class="form-error-text"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group" id="group-confirmPassword">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" data-target="confirmPassword" aria-label="Show password">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="form-error-text"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="register-btn" class="btn btn-primary" style="margin-top: 1.5rem;">
          <span class="spinner"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <!-- Footer Link to Login -->
      <div class="auth-footer">
        Already have an account? <a href="/login.html" id="link-to-login">Sign in here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
